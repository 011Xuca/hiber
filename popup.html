<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--f:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    --bg:#eef8fe;--card:#fff;--fg:#0c2a3b;--mut:#5a7b8f;--line:#d3e8f4;--ac:#38bdf8;--act:#0369a1;--on:#04202e;--glow:#bfe8fb;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07131c;--card:#0d2030;--fg:#e4f3fc;--mut:#8db0c5;--line:#1c3648;--ac:#38bdf8;--act:#7dd3fc;--on:#04202e;--glow:#12425e;color-scheme:dark}}
  :root[data-theme=dark]{--bg:#07131c;--card:#0d2030;--fg:#e4f3fc;--mut:#8db0c5;--line:#1c3648;--ac:#38bdf8;--act:#7dd3fc;--on:#04202e;--glow:#12425e;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;width:370px;padding:16px 14px 14px;background:radial-gradient(120% 60% at 0 0,var(--glow),var(--bg) 60%) var(--bg);color:var(--fg);font:13.5px/1.4 var(--f)}
  header{display:flex;align-items:center;gap:10px}
  header img{width:38px;height:38px;border-radius:10px;display:block}
  h1{font-size:23px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1;flex:1;color:var(--act)}
  .tag{color:var(--mut);font-size:12.5px;margin:6px 2px 10px}
  #upd{display:block;margin:0 0 10px;padding:8px 10px;border:1px solid var(--act);border-radius:10px;color:var(--act);font:600 12px var(--f);text-decoration:none}
  #upd[hidden]{display:none}
  #stats{color:var(--mut);margin:0 2px 10px;font-size:12px}
  .levels{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
  .levels button{background:none;border:0;border-radius:9px;padding:7px 0;color:var(--mut);font:600 12px var(--f);cursor:pointer}
  .levels button.on{background:var(--ac);color:var(--on)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:10px}
  h2,summary{margin:0;padding:9px 0 3px;font:700 11px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--act)}
  summary{cursor:pointer;padding-bottom:9px}
  .row{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
  h2+div>.row:first-child{border-top:0}
  .row b{font-weight:600;display:block}
  .row small{display:block;color:var(--mut);font-size:11.5px;line-height:1.3}
  .row input,.sw input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
  .row input::after,.sw input::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
  .row input:checked,.sw input:checked{background:var(--ac)}
  .row input:checked::after,.sw input:checked::after{left:19px}
  .sw{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
  .field{padding:8px 0 10px;border-top:1px solid var(--line)}
  .field>b{font-weight:600;display:block;margin-bottom:5px}
  .time{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .time input{width:78px}
  .hint{margin:-4px 0 8px;color:var(--mut);font-size:11.5px}
  input[type=number],textarea,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font:13px var(--f)}
  textarea{width:100%;resize:vertical}
  .pref{display:flex;gap:10px;padding:10px 12px}
  .pref label{flex:1;font-size:12px;color:var(--mut)}
  .pref select{width:100%;margin-top:3px}
  option{background:var(--card)}
  #tipsBody p{margin:0;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
  .go{width:100%;padding:11px;border:0;border-radius:12px;background:linear-gradient(135deg,#7dd3fc,#38bdf8);color:var(--on);font:700 13.5px var(--f);cursor:pointer}
  .alt{margin-top:8px;width:100%;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--act);font:600 12.5px var(--f);cursor:pointer}
  .alt[hidden]{display:none}
  a.alt{display:block;box-sizing:border-box;text-align:center;text-decoration:none}
  .top{display:flex;gap:8px;margin-bottom:10px}
  .top .alt{margin-top:0;flex:1}
</style>
</head>
<body>
<nav class="top">
  <a class="alt" href="https://011xuca.github.io/links/" target="_blank" rel="noopener" data-t="social"></a>
  <a class="alt" href="https://ko-fi.com/011xuca" target="_blank" rel="noopener" data-t="donate"></a>
</nav>
<header>
  <img src="logo.svg" alt="">
  <h1>Hiber</h1>
  <label class="sw"><span data-t="active"></span><input type="checkbox" id="on"></label>
</header>
<p class="tag" data-t="tag"></p>
<a id="upd" hidden target="_blank"></a>
<div id="stats"></div>
<div class="levels" id="levels"></div>

<section class="card">
  <h2 data-t="gSleep"></h2><div id="g_sleep"></div>
  <div class="field time"><b data-t="sleepAfter" style="margin:0"></b>
    <input type="number" id="mins" min="1" step="any"> <select id="unit"></select></div>
  <p class="hint" data-t="timeHint"></p>
</section>
<section class="card"><h2 data-t="gSpeed"></h2><div id="g_speed"></div></section>
<section class="card"><h2 data-t="gAds"></h2><div id="g_ads"></div></section>
<section class="card">
  <h2 data-t="gSites"></h2>
  <div class="field"><b data-t="never"></b><textarea id="wl" rows="2" data-ph="wlHint"></textarea></div>
  <div class="field"><b data-t="always"></b><textarea id="sl" rows="2" data-ph="wlHint"></textarea></div>
</section>
<details class="card" id="tips"><summary id="tipsHead"></summary><div id="tipsBody"></div></details>
<section class="card pref">
  <label><span data-t="lang"></span><select id="lang"></select></label>
  <label><span data-t="theme"></span><select id="theme"></select></label>
</section>
<button class="go" id="sweep"></button>
<script src="defaults.js"></script>
<script src="popup.js"></script>
</body>
</html>
